[project]
name = "rate-limiter-service"
version = "0.1.0"
description = "Standalone networked token bucket and sliding-window rate limiter service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.105.0",
  "uvicorn[standard]>=0.24.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.8.0",
  "httpx>=0.28.0"
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.22.0"
]
[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
